services:
  postgres:
    image: postgres:16-alpine
    container_name: cybergys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybergys
      POSTGRES_USER: cybergys
      POSTGRES_PASSWORD: cybergys_local_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybergys -d cybergys"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: cybergys-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
